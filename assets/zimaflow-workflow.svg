<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 558" role="img" aria-labelledby="zimaflow-workflow-title zimaflow-workflow-desc">
  <title id="zimaflow-workflow-title">Zimaflow workflow / 工作流</title>
  <desc id="zimaflow-workflow-desc">Start a task / 开始任务: choose Quick, Standard, or Full, then Implement &amp; verify / 实现与验证 and Close the session / 会话收尾. Save a handover when needed. Continue a task / 续接任务: recall state, handover, and spec to resume at the current step.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17263d; }
    .heading { font-size: 33px; font-weight: 700; }
    .node-title { font-size: 21px; font-weight: 700; }
    .node-zh { font-size: 20px; font-weight: 600; }
    .detail { font-size: 16px; fill: #43536c; }
    .mode { font-size: 17px; font-weight: 700; }
    .card { fill: #fff; stroke: #b6c5d8; stroke-width: 1.5; }
    .entry { fill: #ebf3ff; stroke: #789cce; }
    .close { fill: #f0f7f4; stroke: #8eafa1; }
    .divider { stroke: #cad5e3; stroke-width: 1; }
    .arrow { fill: none; stroke: #425a76; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#zimaflow-workflow-arrow); }
    .conditional { stroke-dasharray: 6 6; }
  </style>
  <defs>
    <marker id="zimaflow-workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#425a76"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1018" height="556" rx="22" fill="#f6f8fc" stroke="#d6dfeb"/>
  <text class="heading" x="36" y="63">Zimaflow workflow / 工作流</text>
  <line class="divider" x1="36" y1="83" x2="984" y2="83"/>

  <path class="arrow" d="M 204 219 H 231"/>
  <path class="arrow" d="M 498 219 H 517"/>
  <path class="arrow" d="M 728 219 H 759"/>
  <path class="arrow" d="M 204 437 H 231"/>
  <path class="arrow" d="M 486 437 H 656 Q 680 437 680 413 V 287"/>
  <path class="arrow conditional" d="M 872 286 V 381"/>
  <path class="arrow conditional" d="M 872 492 V 513 Q 872 531 854 531 H 138 Q 120 531 120 513 V 493"/>

  <rect class="card entry" x="36" y="152" width="168" height="134" rx="14"/>
  <text class="node-title" x="54" y="208">Start a task</text>
  <text class="node-zh" x="54" y="239">开始任务</text>

  <rect class="card" x="232" y="107" width="266" height="224" rx="14"/>
  <text class="node-title" x="252" y="139">Route by risk</text>
  <text class="node-zh" x="252" y="165">按风险分档</text>
  <line class="divider" x1="252" y1="180" x2="478" y2="180"/>
  <text class="mode" x="252" y="203">Quick</text>
  <text class="detail" x="338" y="203">Scope &amp; evidence</text>
  <text class="detail" x="338" y="222">范围与证据</text>
  <text class="mode" x="252" y="248">Standard</text>
  <text class="detail" x="338" y="248">Brief &amp; plan</text>
  <text class="detail" x="338" y="267">简要契约与计划</text>
  <text class="mode" x="252" y="293">Full</text>
  <text class="detail" x="338" y="293">OpenSpec + contract</text>
  <text class="detail" x="338" y="312">确认契约与规范</text>

  <rect class="card" x="518" y="152" width="210" height="134" rx="14"/>
  <text class="node-title" x="532" y="186">Implement &amp; verify</text>
  <text class="node-zh" x="532" y="213">实现与验证</text>
  <text class="detail" x="532" y="244">Checks and evidence</text>
  <text class="detail" x="532" y="265">执行检查并留存证据</text>

  <rect class="card close" x="760" y="152" width="224" height="134" rx="14"/>
  <text class="node-title" x="780" y="186">Close the session</text>
  <text class="node-zh" x="780" y="213">会话收尾</text>
  <text class="detail" x="780" y="244">Check readiness to close</text>
  <text class="detail" x="780" y="265">核对状态，按需沉淀经验</text>

  <rect class="card entry" x="36" y="382" width="168" height="110" rx="14"/>
  <text class="node-title" x="54" y="431">Continue task</text>
  <text class="node-zh" x="54" y="460">续接任务</text>

  <rect class="card" x="232" y="382" width="254" height="110" rx="14"/>
  <text class="node-title" x="252" y="411">Recall context</text>
  <text class="node-zh" x="252" y="435">恢复任务上下文</text>
  <text class="detail" x="252" y="458">State, handover, and spec</text>
  <text class="detail" x="252" y="478">读取状态、交接与规范</text>
  <text class="detail" x="502" y="400">Resume at current step</text>
  <text class="detail" x="502" y="421">从当前进度继续</text>

  <text class="detail" x="889" y="345">If needed / 按需</text>
  <rect class="card" x="760" y="382" width="224" height="110" rx="14"/>
  <text class="node-title" x="780" y="411">Save a handover</text>
  <text class="node-zh" x="780" y="435">保留交接</text>
  <text class="detail" x="780" y="458">State and next steps</text>
  <text class="detail" x="780" y="478">记录进度和下一步</text>

  <text class="detail" x="496" y="517" text-anchor="middle">Next session / 下次会话</text>
</svg>
